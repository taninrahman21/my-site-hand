<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#e8edf3"/>
  <rect y="640" width="1200" height="260" fill="#c7a77f"/>
  <rect y="630" width="1200" height="16" fill="#b08f66"/>
  <!-- Pipes on wall -->
  <g fill="none" stroke="#9aa5b4" stroke-width="34" stroke-linecap="round"><path d="M80 120 H520 V360"/><path d="M1120 200 H760 V460"/></g>
  <g fill="#b8420d"><rect x="490" y="330" width="60" height="40" rx="8"/><rect x="730" y="430" width="60" height="40" rx="8"/></g>
  <!-- Toolbox -->
  <g transform="translate(300 420)">
    <ellipse cx="300" cy="230" rx="320" ry="20" fill="#000" opacity="0.15"/>
    <path d="M200 40 Q200 0 240 0 H360 Q400 0 400 40 V60 H370 V40 Q370 30 360 30 H240 Q230 30 230 40 V60 H200 Z" fill="#0f1b2d"/>
    <rect x="0" y="60" width="600" height="160" rx="16" fill="#b8420d"/>
    <rect x="0" y="60" width="600" height="40" rx="12" fill="#d4581f"/>
    <rect x="270" y="110" width="60" height="30" rx="6" fill="#ffd166"/>
    <!-- Tools sticking out -->
    <g transform="translate(60 -90) rotate(-15)"><rect width="30" height="180" rx="10" fill="#9aa5b4"/><path d="M-20 -10 h70 v40 h-20 v-20 h-30 v20 h-20 z" fill="#9aa5b4"/></g>
    <g transform="translate(470 -110) rotate(18)"><rect width="34" height="120" rx="8" fill="#0f1b2d"/><rect x="8" y="120" width="18" height="90" fill="#d1d5db"/></g>
  </g>
  <!-- Tape measure and pipe fittings -->
  <g transform="translate(980 720)"><circle r="70" fill="#ffd166"/><circle r="30" fill="#0f1b2d"/><rect x="40" y="40" width="180" height="22" fill="#ffd166"/></g>
  <g fill="#9aa5b4"><rect x="120" y="740" width="110" height="40" rx="10"/><rect x="250" y="750" width="40" height="80" rx="10"/></g>
</svg>
