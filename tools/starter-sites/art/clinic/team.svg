<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f1ee"/>
      <stop offset="1" stop-color="#cfe6e0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc8"/>
      <stop offset="1" stop-color="#dccab0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef0"/>
      <stop offset="1" stop-color="#9fb0b6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="170" r="260" fill="#ffffff" opacity="0.35"/>
  <circle cx="160" cy="760" r="220" fill="#0d6b66" opacity="0.08"/>

  <!-- Desk surface, seen from above -->
  <rect x="80" y="120" width="1040" height="660" rx="36" fill="url(#desk)"/>
  <rect x="80" y="740" width="1040" height="40" rx="20" fill="#cdb898" opacity="0.6"/>

  <!-- Notebook -->
  <g transform="translate(170 210) rotate(-6)">
    <rect x="10" y="12" width="400" height="500" rx="18" fill="#000" opacity="0.08"/>
    <rect width="400" height="500" rx="18" fill="#ffffff"/>
    <rect width="46" height="500" rx="18" fill="#0d6b66"/>
    <rect x="30" width="16" height="500" fill="#0d6b66"/>
    <g fill="#d5e3e0">
      <rect x="86" y="80" width="260" height="12" rx="6"/>
      <rect x="86" y="130" width="280" height="12" rx="6"/>
      <rect x="86" y="180" width="230" height="12" rx="6"/>
      <rect x="86" y="230" width="270" height="12" rx="6"/>
      <rect x="86" y="280" width="200" height="12" rx="6"/>
      <rect x="86" y="330" width="250" height="12" rx="6"/>
    </g>
    <rect x="86" y="400" width="120" height="44" rx="10" fill="#dcefeb"/>
  </g>

  <!-- Pen -->
  <g transform="translate(560 220) rotate(28)">
    <rect width="26" height="300" rx="13" fill="#11292b"/>
    <rect y="230" width="26" height="70" rx="8" fill="#c9805a"/>
    <path d="M0 290 L13 330 L26 290 Z" fill="#c9a37f"/>
  </g>

  <!-- Stethoscope -->
  <g fill="none" stroke-linecap="round">
    <path d="M640 260 C600 380 640 520 760 560 C880 600 960 520 930 420" stroke="#11292b" stroke-width="22"/>
    <path d="M640 260 C680 200 740 190 780 230" stroke="#11292b" stroke-width="22"/>
    <path d="M930 420 C915 360 950 320 990 330" stroke="#11292b" stroke-width="22"/>
  </g>
  <circle cx="790" cy="236" r="16" fill="#9fb0b6"/>
  <circle cx="996" cy="332" r="16" fill="#9fb0b6"/>
  <g transform="translate(760 560)">
    <circle r="78" fill="#000" opacity="0.08" cx="8" cy="10"/>
    <circle r="78" fill="url(#metal)"/>
    <circle r="54" fill="#f4f7f8"/>
    <circle r="54" fill="none" stroke="#0d6b66" stroke-width="10"/>
  </g>

  <!-- Mug -->
  <g transform="translate(930 560)">
    <circle cx="6" cy="8" r="82" fill="#000" opacity="0.08"/>
    <circle r="82" fill="#ffffff"/>
    <circle r="62" fill="#7a5238"/>
    <circle r="62" fill="none" stroke="#f1e6da" stroke-width="6"/>
    <rect x="70" y="-18" width="58" height="36" rx="18" fill="#ffffff"/>
  </g>

  <!-- Leaf sprig -->
  <g transform="translate(1000 150) rotate(20)">
    <path d="M0 0 C40 80 40 180 0 260" fill="none" stroke="#3c8f6f" stroke-width="8"/>
    <path d="M12 60 C70 30 110 50 120 80 C80 100 40 90 12 60 Z" fill="#4fa784"/>
    <path d="M18 130 C-40 100 -80 120 -90 150 C-50 170 -10 160 18 130 Z" fill="#66b896"/>
    <path d="M14 200 C70 170 110 190 120 220 C80 240 40 230 14 200 Z" fill="#4fa784"/>
  </g>
</svg>
