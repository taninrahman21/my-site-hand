<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5f3"/>
      <stop offset="1" stop-color="#dfece8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ea"/>
      <stop offset="1" stop-color="#f4fbf9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c7ae"/>
      <stop offset="1" stop-color="#c7b294"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9805a"/>
      <stop offset="1" stop-color="#a9603e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect y="690" width="1200" height="210" fill="url(#floor)"/>
  <rect y="682" width="1200" height="12" fill="#f7f1e8"/>

  <!-- Arched window -->
  <g transform="translate(520 120)">
    <path d="M0 520 V200 A200 200 0 0 1 400 200 V520 Z" fill="#ffffff"/>
    <path d="M24 500 V204 A176 176 0 0 1 376 204 V500 Z" fill="url(#sky)"/>
    <circle cx="282" cy="150" r="46" fill="#fff6d6"/>
    <path d="M24 420 C110 380 170 400 236 372 C292 350 330 360 376 340 V500 H24 Z" fill="#a8d5c6"/>
    <path d="M24 450 C120 430 200 446 280 420 C320 408 350 410 376 402 V500 H24 Z" fill="#7fbfab"/>
    <rect x="196" y="28" width="8" height="472" fill="#ffffff"/>
    <rect x="24" y="300" width="352" height="8" fill="#ffffff"/>
    <rect x="-16" y="512" width="432" height="22" rx="6" fill="#ffffff"/>
  </g>
  <!-- Sunlight on the floor -->
  <path d="M520 694 L920 694 L1060 900 L470 900 Z" fill="url(#light)"/>

  <!-- Bench -->
  <g transform="translate(110 520)">
    <rect x="0" y="0" width="330" height="120" rx="26" fill="#0d6b66"/>
    <rect x="0" y="70" width="330" height="70" rx="22" fill="#0b5a56"/>
    <rect x="22" y="138" width="16" height="44" rx="6" fill="#5b4636"/>
    <rect x="292" y="138" width="16" height="44" rx="6" fill="#5b4636"/>
    <rect x="30" y="-36" width="120" height="74" rx="22" fill="#f3c9a8"/>
    <rect x="166" y="-30" width="120" height="68" rx="22" fill="#dcefeb"/>
  </g>
  <ellipse cx="275" cy="706" rx="190" ry="12" fill="#000" opacity="0.08"/>

  <!-- Framed picture -->
  <g transform="translate(170 220)">
    <rect width="190" height="230" rx="8" fill="#ffffff"/>
    <rect x="16" y="16" width="158" height="198" rx="4" fill="#dcefeb"/>
    <circle cx="95" cy="92" r="40" fill="#0d6b66" opacity="0.85"/>
    <path d="M16 214 L80 140 L120 180 L150 150 L174 176 V214 Z" fill="#7fbfab"/>
  </g>

  <!-- Plant -->
  <g transform="translate(1000 400)">
    <path d="M60 300 C40 220 -40 160 -70 90 C-10 120 40 180 60 250" fill="#3c8f6f"/>
    <path d="M70 300 C70 200 20 100 40 0 C90 80 100 200 80 300" fill="#4fa784"/>
    <path d="M80 300 C110 220 170 170 200 100 C190 180 140 240 92 300" fill="#3c8f6f"/>
    <path d="M70 300 C40 250 0 230 -40 230 C0 260 30 280 60 300" fill="#66b896"/>
    <path d="M10 290 H150 L132 400 H28 Z" fill="url(#pot)"/>
    <rect x="0" y="278" width="160" height="24" rx="8" fill="#d89470"/>
  </g>
  <ellipse cx="1080" cy="804" rx="90" ry="10" fill="#000" opacity="0.08"/>

  <!-- Side table with cup -->
  <g transform="translate(860 610)">
    <rect x="0" y="0" width="120" height="14" rx="7" fill="#5b4636"/>
    <rect x="52" y="14" width="16" height="80" fill="#5b4636"/>
    <rect x="22" y="90" width="76" height="10" rx="5" fill="#5b4636"/>
    <rect x="36" y="-40" width="40" height="40" rx="8" fill="#ffffff"/>
    <path d="M76 -30 a14 14 0 0 1 0 22" fill="none" stroke="#ffffff" stroke-width="7"/>
  </g>
</svg>
