<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#dfe9f2"/>
  <rect y="700" width="1200" height="200" fill="#bfc4cc"/>
  <rect y="690" width="1200" height="16" fill="#a3a9b3"/>
  <!-- Three townhouses -->
  <g transform="translate(120 160)">
    <g><path d="M0 130 L160 30 L320 130 Z" fill="#1d3c5e"/><rect x="0" y="130" width="320" height="400" fill="#e8c9a0"/>
       <g fill="#bfdcef" stroke="#ffffff" stroke-width="8"><rect x="40" y="170" width="90" height="100"/><rect x="190" y="170" width="90" height="100"/><rect x="40" y="320" width="90" height="100"/></g>
       <rect x="190" y="320" width="90" height="210" fill="#1d3c5e"/></g>
    <g transform="translate(320 0)"><path d="M0 130 L160 20 L320 130 Z" fill="#0e1c2b"/><rect x="0" y="130" width="320" height="400" fill="#9fb8a5"/>
       <g fill="#bfdcef" stroke="#ffffff" stroke-width="8"><rect x="40" y="170" width="90" height="100"/><rect x="190" y="170" width="90" height="100"/><rect x="190" y="320" width="90" height="100"/></g>
       <rect x="40" y="320" width="90" height="210" fill="#b5312c"/></g>
    <g transform="translate(640 0)"><path d="M0 130 L160 30 L320 130 Z" fill="#1d3c5e"/><rect x="0" y="130" width="320" height="400" fill="#f4f1ec"/>
       <g fill="#bfdcef" stroke="#ffffff" stroke-width="8"><rect x="40" y="170" width="90" height="100"/><rect x="190" y="170" width="90" height="100"/><rect x="40" y="320" width="90" height="100"/></g>
       <rect x="190" y="320" width="90" height="210" fill="#d9b26b"/></g>
  </g>
  <!-- Steps and plants -->
  <g fill="#9a958c"><rect x="300" y="690" width="120" height="14"/><rect x="450" y="690" width="120" height="14"/><rect x="940" y="690" width="120" height="14"/></g>
  <g fill="#4fa784"><circle cx="110" cy="690" r="40"/><circle cx="1110" cy="690" r="40"/></g>
  <!-- Sold sign -->
  <g transform="translate(1000 520)"><rect x="-6" y="0" width="12" height="180" fill="#5a4636"/><rect x="-80" y="20" width="160" height="80" rx="6" fill="#ffffff" stroke="#1d3c5e" stroke-width="6"/><rect x="-50" y="48" width="100" height="22" rx="4" fill="#1d3c5e"/></g>
</svg>
