<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#1a1e17"/>
  <rect y="660" width="1200" height="240" fill="#262b22"/>
  <g stroke="#30362b" stroke-width="4"><line x1="0" y1="740" x2="1200" y2="740"/><line x1="0" y1="820" x2="1200" y2="820"/></g>
  <!-- Wall text bar -->
  <rect x="80" y="90" width="420" height="70" fill="#c8f04a"/>
  <rect x="110" y="112" width="250" height="26" fill="#1a1e17"/>
  <!-- Squat rack -->
  <g fill="#3a4034">
    <rect x="300" y="220" width="30" height="480"/><rect x="760" y="220" width="30" height="480"/>
    <rect x="300" y="210" width="490" height="26"/>
    <rect x="290" y="690" width="510" height="20"/>
  </g>
  <g fill="#c8f04a"><rect x="330" y="400" width="40" height="14"/><rect x="720" y="400" width="40" height="14"/></g>
  <!-- Barbell on rack -->
  <rect x="200" y="384" width="700" height="16" rx="8" fill="#d1d5db"/>
  <g><rect x="220" y="320" width="46" height="144" rx="8" fill="#0f0f0f"/><rect x="270" y="340" width="30" height="104" rx="6" fill="#c8f04a"/>
     <rect x="834" y="320" width="46" height="144" rx="8" fill="#0f0f0f"/><rect x="800" y="340" width="30" height="104" rx="6" fill="#c8f04a"/></g>
  <!-- Kettlebells -->
  <g transform="translate(900 560)">
    <path d="M30 40 a50 50 0 0 1 100 0" fill="none" stroke="#0f0f0f" stroke-width="18"/><circle cx="80" cy="100" r="70" fill="#0f0f0f"/>
    <path d="M200 60 a40 40 0 0 1 80 0" fill="none" stroke="#c8f04a" stroke-width="14"/><circle cx="240" cy="110" r="56" fill="#c8f04a"/>
  </g>
  <!-- Plates stack -->
  <g transform="translate(110 560)"><ellipse cx="80" cy="120" rx="80" ry="22" fill="#0f0f0f"/><ellipse cx="80" cy="96" rx="80" ry="22" fill="#2b2b2b"/><ellipse cx="80" cy="72" rx="70" ry="20" fill="#0f0f0f"/><ellipse cx="80" cy="50" rx="60" ry="18" fill="#c8f04a"/></g>
  <!-- Lights -->
  <g fill="#f1f5ec" opacity="0.9"><rect x="560" y="40" width="260" height="10" rx="5"/><rect x="900" y="40" width="200" height="10" rx="5"/></g>
</svg>
