<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9875c"/>
      <stop offset="1" stop-color="#9c6b43"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe6d6"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#wood)"/>
  <g stroke="#8a5c37" stroke-width="3" opacity="0.35">
    <line x1="0" y1="180" x2="1200" y2="160"/><line x1="0" y1="420" x2="1200" y2="400"/><line x1="0" y1="660" x2="1200" y2="640"/>
  </g>
  <rect x="80" y="70" width="560" height="760" rx="12" fill="#f4ead9" opacity="0.9"/>
  <g stroke="#d9c6a6" stroke-width="4" opacity="0.6"><line x1="80" y1="140" x2="640" y2="140"/><line x1="80" y1="760" x2="640" y2="760"/></g>

  <!-- Bread board -->
  <g transform="translate(150 140)">
    <rect x="8" y="12" width="300" height="200" rx="40" fill="#000" opacity="0.12"/>
    <rect width="300" height="200" rx="40" fill="#c99a64"/>
    <ellipse cx="150" cy="100" rx="110" ry="70" fill="#d9a35e"/>
    <ellipse cx="150" cy="92" rx="100" ry="58" fill="#e8b878"/>
    <path d="M85 80 q30 -25 60 0 M135 70 q30 -25 60 0 M115 110 q30 -25 60 0" stroke="#c5874a" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Olive bowl -->
  <g transform="translate(560 260)">
    <circle r="96" cx="6" cy="10" fill="#000" opacity="0.12"/>
    <circle r="96" fill="#2f4a6b"/>
    <circle r="78" fill="#eef1e4"/>
    <g fill="#556b2f"><ellipse cx="-25" cy="-20" rx="20" ry="14"/><ellipse cx="18" cy="-28" rx="20" ry="14" transform="rotate(30 18 -28)"/><ellipse cx="30" cy="12" rx="20" ry="14"/><ellipse cx="-12" cy="25" rx="20" ry="14" transform="rotate(-20 -12 25)"/></g>
    <g fill="#3a2b2b"><ellipse cx="-40" cy="10" rx="17" ry="12"/><ellipse cx="0" cy="0" rx="17" ry="12"/></g>
  </g>
  <!-- Salad plate -->
  <g transform="translate(390 560)">
    <circle r="180" cx="8" cy="12" fill="#000" opacity="0.12"/>
    <circle r="180" fill="url(#plate)"/>
    <circle r="140" fill="none" stroke="#e3d6bf" stroke-width="4"/>
    <g fill="#6f9a3e"><path d="M-80 -20 q50 -70 110 -10 q-60 30 -110 10z"/><path d="M-20 40 q60 -60 120 0 q-60 40 -120 0z"/><path d="M-100 40 q40 -40 90 5 q-50 30 -90 -5z"/></g>
    <g fill="#d64933"><circle cx="40" cy="-40" r="22"/><circle cx="-50" cy="70" r="20"/><circle cx="80" cy="50" r="18"/></g>
    <g fill="#f4ead2"><rect x="-20" y="-70" width="40" height="30" rx="6" transform="rotate(15)"/><rect x="0" y="70" width="36" height="28" rx="6" transform="rotate(-10)"/></g>
  </g>
  <!-- Wine glasses -->
  <g transform="translate(860 170)">
    <circle r="72" cx="5" cy="8" fill="#000" opacity="0.1"/>
    <circle r="72" fill="#f6eee6" opacity="0.85"/>
    <circle r="54" fill="#7a1f2e"/>
    <circle r="54" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.5"/>
  </g>
  <g transform="translate(1010 330)">
    <circle r="72" cx="5" cy="8" fill="#000" opacity="0.1"/>
    <circle r="72" fill="#f6eee6" opacity="0.85"/>
    <circle r="54" fill="#8c2a37"/>
    <circle r="54" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.5"/>
  </g>
  <!-- Napkin and fork -->
  <g transform="translate(820 560) rotate(-12)">
    <rect width="230" height="230" rx="10" fill="#e9dccb"/>
    <rect x="20" y="20" width="190" height="190" rx="6" fill="none" stroke="#d1bfa6" stroke-width="4"/>
    <rect x="100" y="-40" width="18" height="300" rx="9" fill="#cfd4d8"/>
    <rect x="90" y="-60" width="38" height="70" rx="8" fill="#cfd4d8"/>
  </g>
  <!-- Oil bottle -->
  <g transform="translate(1010 640)">
    <circle r="64" cx="5" cy="8" fill="#000" opacity="0.12"/>
    <circle r="64" fill="#8c9b45"/>
    <circle r="40" fill="#a9b85e"/>
    <circle r="18" fill="#3d3a2a"/>
  </g>
</svg>
