      <rect x="606" y="52" width="190" height="96" rx="10" fill="#4b32c3"/><rect x="626" y="72" width="80" height="10" rx="5" fill="#b9b2e6"/><rect x="626" y="96" width="120" height="26" rx="6" fill="#ffffff"/>
